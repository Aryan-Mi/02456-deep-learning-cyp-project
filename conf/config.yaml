# Shared experiment settings. Choose a model with model=<name> (conf/model/) and
# a readout head with readout=<name> (conf/readout/; each model sets its own default).
# Example: python finetune.py model=atom_jepa readout=linear task=classification train.epochs=50
defaults:
  - _self_
  - readout: mlp
  - model: atom_jepa

task: regression # regression | classification
data: data # Output folder of prepare_data.py
seed: 42
experiment_name: manual
device: cuda
evaluate_test: false # Enable only for Part 5.

hydra:
  run:
    dir: runs/${task}/${model.name}/${experiment_name}/${now:%Y-%m-%d_%H-%M-%S-%f}
  job:
    chdir: false
