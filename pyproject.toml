[project]
name = "dtu-deep-learning-cyp-project"
version = "0.1.0"
description = "DTU 02456 CYP inhibition project: reproducible data exploration and molecular models"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.6.0",
  "atom-jepa[rdkit]==0.3.0",
  "numpy>=1.26,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.5,<2",
  "e3nn==0.5.8",
  "rdkit>=2025.3.1,<2026",
  "hydra-core==1.3.2",
  "descriptastorus==2.8.0",
  "lightgbm==4.6.0",
  "matplotlib>=3.9,<4",
]

[dependency-groups]
dev = ["ruff>=0.11,<1"]
notebook = ["jupyterlab>=4.3,<5", "ipykernel>=6.29,<8"]
tuning = ["optuna>=4,<5"]
chemeleon = ["chemprop==2.2.1"]

[tool.uv]
package = false

[tool.uv.sources]
torch = [{ index = "pytorch-cu124", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]